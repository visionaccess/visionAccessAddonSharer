name = visionAccessAddonSharer
summary = "VisionAccess Add-on Sharer"
description = """Package any of your installed NVDA add-ons back into .nvda-addon files, so you can back them up, reinstall them on another computer, or share them with friends. Developed by VisionAccess (www.visionaccess.org).
Commands:
NVDA+Shift+Alt+A: open the VisionAccess Add-on Sharer window (also in NVDA menu, Tools). You can change this key in Input Gestures.
Keys in the window: Alt+I add-on list, Space check or uncheck an add-on, Alt+A check all, Alt+U uncheck all, Alt+F output folder, Alt+B browse for a folder, Alt+O open the folder when finished, Alt+C create the packages, Alt+L or Escape close.
Download the latest version: https://github.com/visionaccess/visionAccessAddonSharer/releases/latest"""
author = "Mukesh Jain (VisionAccess) <info@visionaccess.org>"
url = https://github.com/visionaccess/visionAccessAddonSharer/releases/latest
version = 1.0.2
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.2.0
updateChannel = None
